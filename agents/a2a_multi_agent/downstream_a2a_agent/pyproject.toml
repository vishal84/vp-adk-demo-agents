[project]
name = "downstream-a2a-agent"
version = "0.1.0"
description = "A2A downstream agent with BigQuery tools for authenticated data queries"
requires-python = ">=3.12"
dependencies = [
    "google-adk>=1.18.0",
    "google-cloud-bigquery>=3.25.0",
    "google-cloud-aiplatform[adk,agent_engines]",
    "python-dotenv>=1.0.0",
    "db-dtypes>=1.3.0",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
